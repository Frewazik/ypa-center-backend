# ПОЧЕМУ: хуки local через `uv run` — берут ruff и mypy из uv.lock, а не свои копии.
# Раньше тут были зеркала с ruff v0.5.0 при 0.15 в проекте: хук и ручной запуск
# проверяли по разным правилам, а стабы mypy приходилось дублировать списком.
# Установка хука: `uv run pre-commit install`. Полная проверка — scripts/check.py.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check --fix
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      # ПОЧЕМУ: mypy на весь проект, а не на изменённые файлы — правка в одном
      # модуле ломает типы в другом; с кэшем повторный прогон занимает секунды
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

      - id: makemigrations-check
        name: makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        files: (models\.py|/models/|/migrations/)
        pass_filenames: false
